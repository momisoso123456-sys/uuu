.menu{text-align:left;border-top:1px solid var(--ln)}

.m{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;word-break:break-word}

.snd{width:42px;height:42px;border-radius:50%;background:var(--ac);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;text-decoration:none}

</style>
</head>
